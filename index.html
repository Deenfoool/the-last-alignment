<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d18">
  <meta name="description" content="Последний расклад — браузерный карточный roguelike.">
  <title>Последний расклад — загрузка</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0d0b12; color: #f4ead8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 20%, #2a2038, #0d0b12 58%); }
    .loader { width: min(540px, calc(100% - 32px)); padding: 36px; text-align: center; border: 1px solid #6f5c433d; border-radius: 24px; background: #17131ee8; box-shadow: 0 28px 90px #0009; }
    .sigil { font-size: 62px; color: #e8bc70; filter: drop-shadow(0 0 18px #d79b4955); }
    h1 { margin: 12px 0 8px; font-family: Georgia, serif; font-size: clamp(32px, 7vw, 54px); }
    p { margin: 0; color: #b9adb6; line-height: 1.6; }
    .bar { height: 7px; margin-top: 24px; overflow: hidden; border-radius: 999px; background: #ffffff14; }
    .bar::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ad7149, #f0c978); animation: move 1.1s ease-in-out infinite alternate; }
    .error { color: #ef9494; white-space: pre-wrap; }
    @keyframes move { from { transform: translateX(-70%); } to { transform: translateX(210%); } }
  </style>
</head>
<body>
  <main class="loader" id="loader">
    <div class="sigil" aria-hidden="true">♠</div>
    <h1>Последний расклад</h1>
    <p id="loaderText">Разворачиваем игровой мир…</p>
    <div class="bar" aria-hidden="true"></div>
  </main>

  <script>
    "use strict";

    const BUNDLE_PARTS = 7;
    const BUNDLE_HASH = "c91fb6c1dccd4aec9c07ccd77ea43e076dd7beea13abfcb6debf8338a5a38313";
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value.replace(/\s+/g, ""));
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      return bytes;
    }

    function bytesToHex(bytes) {
      return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    function parseTar(bytes) {
      const files = new Map();
      let offset = 0;
      while (offset + 512 <= bytes.length) {
        const header = bytes.slice(offset, offset + 512);
        if (header.every((byte) => byte === 0)) break;
        const name = decoder.decode(header.slice(0, 100)).replace(/\0.*$/, "");
        const sizeText = decoder.decode(header.slice(124, 136)).replace(/\0.*$/, "").trim();
        const size = Number.parseInt(sizeText || "0", 8);
        const start = offset + 512;
        const end = start + size;
        files.set(name.replace(/^\.\//, ""), bytes.slice(start, end));
        offset = start + Math.ceil(size / 512) * 512;
      }
      return files;
    }

    async function unpackBundle() {
      if (!("DecompressionStream" in window) || !crypto?.subtle) {
        throw new Error("Нужен современный браузер с поддержкой DecompressionStream и Web Crypto.");
      }

      const loaderText = document.querySelector("#loaderText");
      const requests = Array.from({ length: BUNDLE_PARTS }, (_, index) =>
        fetch(`.upgrade/part${String(index).padStart(2, "0")}.txt`, { cache: "no-store" }).then((response) => {
          if (!response.ok) throw new Error(`Не удалось загрузить часть ${index + 1}.`);
          return response.text();
        })
      );
      const encoded = (await Promise.all(requests)).join("");
      const archive = base64ToBytes(encoded);
      const hash = bytesToHex(new Uint8Array(await crypto.subtle.digest("SHA-256", archive)));
      if (hash !== BUNDLE_HASH) throw new Error("Контрольная сумма сборки не совпала. Обновите страницу без кэша.");

      loaderText.textContent = "Проверяем карты, события и маршрут…";
      const stream = new Blob([archive]).stream().pipeThrough(new DecompressionStream("gzip"));
      const unpacked = new Uint8Array(await new Response(stream).arrayBuffer());
      const files = parseTar(unpacked);
      for (const required of ["index.html", "styles.css", "data.js", "game.js"]) {
        if (!files.has(required)) throw new Error(`В сборке отсутствует ${required}.`);
      }
      return files;
    }

    function mountGame(files) {
      const source = decoder.decode(files.get("index.html"));
      const parsed = new DOMParser().parseFromString(source, "text/html");
      parsed.querySelectorAll('link[href="styles.css"], script[src="data.js"], script[src="game.js"]').forEach((node) => node.remove());

      document.documentElement.lang = parsed.documentElement.lang || "ru";
      document.head.replaceChildren(...Array.from(parsed.head.childNodes).map((node) => document.importNode(node, true)));
      const style = document.createElement("style");
      style.dataset.source = "bundled-styles";
      style.textContent = decoder.decode(files.get("styles.css"));
      document.head.append(style);
      document.body.replaceChildren(...Array.from(parsed.body.childNodes).map((node) => document.importNode(node, true)));

      for (const fileName of ["data.js", "game.js"]) {
        const script = document.createElement("script");
        script.dataset.source = fileName;
        script.textContent = `${decoder.decode(files.get(fileName))}\n//# sourceURL=${fileName}`;
        document.body.append(script);
      }
    }

    unpackBundle()
      .then(mountGame)
      .catch((error) => {
        console.error(error);
        const loader = document.querySelector("#loader");
        loader.querySelector(".bar")?.remove();
        const text = loader.querySelector("#loaderText");
        text.classList.add("error");
        text.textContent = `Не удалось запустить игру.\n${error.message}`;
      });
  </script>
</body>
</html>
