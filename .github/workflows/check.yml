name: Static checks

on:
  push:
    branches:
      - main
      - feature/playable-prototype
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check game.js

      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f game.js
          grep -q 'id="hand"' index.html
          grep -q 'src="game.js"' index.html
          grep -q 'href="styles.css"' index.html
