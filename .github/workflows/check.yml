name: Static checks

on:
  push:
    branches:
      - main
      - feature/stage-9-release-candidate
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack verified legacy bundle
        run: python scripts/unpack-bundle.py /tmp/the-last-alignment-source

      - name: Check JavaScript syntax
        run: |
          node --check /tmp/the-last-alignment-source/data.js
          node --check /tmp/the-last-alignment-source/game.js
          node --check /tmp/the-last-alignment-source/sw.js
          node --check /tmp/the-last-alignment-source/scripts/validate-data.js
          node --check brand-runtime.js
          node --check compatibility-runtime.js
          node --check theme-enhancer.js
          node --check src/core/battle-engine.js
          node --check src/core/timed-battle-engine.js
          node --check src/core/timer-settings.js
          node --check src/core/stage4-battle-engine.js
          node --check src/core/stage4-runtime.js
          node --check src/core/stage6-battle-runtime.js
          node --check src/core/stage7-battle-runtime.js
          node --check src/core/dealer-ai.js
          node --check src/core/content-settings.js
          node --check src/core/deck-view-model.js
          node --check src/core/act-run-engine.js
          node --check src/core/run-profile.js
          node --check src/core/storage-vault.js
          node --check src/core/storage-vault-extension.js
          node --check src/core/stage8-compat.js
          node --check src/core/pwa-manager.js
          node --check src/core/release-card-balance.js
          node --check src/core/release-dealer-balance.js
          node --check src/core/release-run-balance.js
          node --check src/core/release-achievements.js
          node --check src/core/release-audio.js
          node --check src/data/card-catalog.js
          node --check src/data/dealer-catalog.js
          node --check src/data/act1-content.js
          node --check src/data/stage2-cards.js
          node --check src/data/stage4-assets.js
          node --check src/data/stage2-assets-scene.js
          node --check src/data/stage2-assets-a.js
          node --check src/data/stage2-assets-b.js
          node --check src/ui/stage2-app.js
          node --check src/ui/stage3-app.js
          node --check src/ui/stage4-runtime.js
          node --check src/ui/stage5-deck.js
          node --check src/ui/stage6-app-loader.js
          node --check src/ui/stage6-dealers.js
          node --check src/ui/stage7-act.js
          node --check src/ui/stage8-system.js
          node --check src/ui/stage8-system-extension.js
          node --check src/ui/stage9-release.js
          node --check src/ui/stage3-initial-save-guard.js
          node --check scripts/test-battle-engine.js
          node --check scripts/test-stage2-battle.js
          node --check scripts/test-timer-settings.js
          node --check scripts/test-stage4-engine.js
          node --check scripts/validate-card-catalog.js
          node --check scripts/simulate-card-catalog.js
          node --check scripts/test-stage5-deck.js
          node --check scripts/test-stage6-dealers.js
          node --check scripts/test-stage6-loader-scope.js
          node --check scripts/test-stage7-act.js
          node --check scripts/test-stage7-battle-runtime.js
          node --check scripts/test-stage8-resilience.js
          node --check scripts/test-stage9-release.js
          node --check scripts/simulate-stage9-balance.js
          node --check scripts/simulate-stage9-battles.js
          node --check sw.js

      - name: Validate legacy game data
        run: |
          cd /tmp/the-last-alignment-source
          node scripts/validate-data.js

      - name: Test game systems
        run: |
          node scripts/test-battle-engine.js
          node scripts/test-stage2-battle.js
          node scripts/test-timer-settings.js
          node scripts/validate-card-catalog.js
          node scripts/test-stage4-engine.js
          node scripts/simulate-card-catalog.js
          node scripts/test-stage5-deck.js
          node scripts/test-stage6-dealers.js
          node scripts/test-stage6-loader-scope.js
          node scripts/test-stage7-act.js
          node scripts/test-stage7-battle-runtime.js

      - name: Test save recovery and import integrity
        run: node scripts/test-stage8-resilience.js

      - name: Test release candidate
        run: |
          node scripts/test-stage9-release.js
          node scripts/simulate-stage9-balance.js
          node scripts/simulate-stage9-battles.js

      - name: Check PWA and release files
        run: |
          test -s index.html
          test -s styles/stage8.css
          test -s styles/stage9.css
          test -s src/core/storage-vault.js
          test -s src/core/storage-vault-extension.js
          test -s src/core/stage8-compat.js
          test -s src/core/pwa-manager.js
          test -s src/core/release-card-balance.js
          test -s src/core/release-dealer-balance.js
          test -s src/core/release-run-balance.js
          test -s src/core/release-achievements.js
          test -s src/core/release-audio.js
          test -s src/ui/stage8-system.js
          test -s src/ui/stage8-system-extension.js
          test -s src/ui/stage9-release.js
          test -s docs/PWA_AND_RECOVERY.md
          test -s docs/RELEASE_CANDIDATE.md
          test -s assets/pwa/icon.svg
          test -s assets/pwa/maskable.svg
          grep -q 'systemOverlay' index.html
          grep -q 'release-card-balance.js' src/core/stage4-runtime.js
          grep -q 'stage9-release.js' src/core/stage4-runtime.js
          grep -q 'bitaya-mast-v13-release-candidate' sw.js
          grep -q 'release-card-balance.js' sw.js
          grep -q 'stage9-release.js' sw.js
          grep -q 'SKIP_WAITING' sw.js
          grep -q 'GET_VERSION' sw.js
          grep -q 'assets/pwa/icon.svg' manifest.webmanifest
          grep -q 'BUNDLE_HASH' legacy.html
