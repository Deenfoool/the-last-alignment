name: Static checks

on:
  push:
    branches:
      - main
      - feature/stage-1-battle-core
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack verified source bundle
        run: python scripts/unpack-bundle.py /tmp/the-last-alignment-source

      - name: Check JavaScript syntax
        run: |
          node --check /tmp/the-last-alignment-source/data.js
          node --check /tmp/the-last-alignment-source/game.js
          node --check /tmp/the-last-alignment-source/sw.js
          node --check /tmp/the-last-alignment-source/scripts/validate-data.js
          node --check brand-runtime.js
          node --check compatibility-runtime.js
          node --check theme-enhancer.js
          node --check src/core/battle-engine.js
          node --check src/core/sample-cards.js
          node --check scripts/test-battle-engine.js
          node --check sw.js

      - name: Validate legacy game data
        run: |
          cd /tmp/the-last-alignment-source
          node scripts/validate-data.js

      - name: Test deterministic battle engine
        run: node scripts/test-battle-engine.js

      - name: Check runtime, branding and assets
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f brand-runtime.js
          test -f compatibility-runtime.js
          test -f theme-enhancer.css
          test -f theme-enhancer.js
          test -f src/core/battle-engine.js
          test -f docs/BATTLE_ENGINE.md
          test -f .upgrade/part00.txt
          test -f .upgrade/part06.txt
          for asset in deck hero enemy icon-attack icon-skill icon-power node-battle node-event node-rest node-elite; do
            test -s "assets/theme/${asset}.svg"
          done
          grep -q 'BUNDLE_HASH' index.html
          grep -q 'DecompressionStream' index.html
          grep -q 'brand-runtime.js?v=5' index.html
          grep -q 'src/core/battle-engine.js?v=1' index.html
          grep -q 'Битая масть' index.html
          grep -q 'Битая масть' manifest.webmanifest
          grep -q 'bitaya-mast-v5-stage-one' sw.js
          grep -q 'assets/theme/deck.svg' theme-enhancer.css
