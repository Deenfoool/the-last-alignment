name: Static checks

on:
  push:
    branches:
      - main
      - feature/stage-2-vertical-slice
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack verified legacy bundle
        run: python scripts/unpack-bundle.py /tmp/the-last-alignment-source

      - name: Check JavaScript syntax
        run: |
          node --check /tmp/the-last-alignment-source/data.js
          node --check /tmp/the-last-alignment-source/game.js
          node --check /tmp/the-last-alignment-source/sw.js
          node --check /tmp/the-last-alignment-source/scripts/validate-data.js
          node --check brand-runtime.js
          node --check compatibility-runtime.js
          node --check theme-enhancer.js
          node --check src/core/battle-engine.js
          node --check src/core/sample-cards.js
          node --check src/data/stage2-cards.js
          node --check src/data/stage2-assets-scene.js
          node --check src/data/stage2-assets-a.js
          node --check src/data/stage2-assets-b.js
          node --check src/ui/stage2-app.js
          node --check scripts/test-battle-engine.js
          node --check scripts/test-stage2-battle.js
          node --check sw.js

      - name: Validate legacy game data
        run: |
          cd /tmp/the-last-alignment-source
          node scripts/validate-data.js

      - name: Test deterministic battle engine
        run: node scripts/test-battle-engine.js

      - name: Smoke-test vertical slice
        run: node scripts/test-stage2-battle.js

      - name: Check vertical-slice files and assets
        run: |
          test -s index.html
          test -s legacy.html
          test -s styles/stage2.css
          test -s src/data/stage2-cards.js
          test -s src/data/stage2-assets-scene.js
          test -s src/data/stage2-assets-a.js
          test -s src/data/stage2-assets-b.js
          test -s src/ui/stage2-app.js
          test -s docs/VISUAL_GUIDE.md
          grep -q -- '--dealer-scene' styles/stage2.css
          grep -q 'data:image/webp;base64' src/data/stage2-assets-scene.js
          grep -q 'data:image/webp;base64' src/data/stage2-assets-a.js
          grep -q 'data:image/webp;base64' src/data/stage2-assets-b.js
          grep -q 'БИТАЯ МАСТЬ' index.html
          grep -q 'bitaya-mast-v6-vertical-slice' sw.js
          grep -q 'legacy.html' sw.js
          grep -q 'src/ui/stage2-app.js' index.html
          grep -q 'BUNDLE_HASH' legacy.html
